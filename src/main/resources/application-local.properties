# Perfil para desarrollo 100% local: Postgres en Docker (docker run --name amancay-local-db),
# separado de Supabase. Hibernate arma el schema solo a partir de las entidades (ddl-auto=update),
# no se toca la base compartida del equipo para nada.
spring.datasource.url=jdbc:postgresql://localhost:5433/amancay
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

# Dummy: no hay Supabase real en este perfil. No se usa para autenticar porque
# el dev-user bypass de abajo reemplaza la verificacion de JWT.
supabase.url=https://local.invalid

# Bypass de autenticacion: cada request se trata como un usuario fijo (se auto-provisiona
# en la tabla users la primera vez). Solo para este perfil, nunca en application.properties.
amancay.security.dev-user.enabled=true
