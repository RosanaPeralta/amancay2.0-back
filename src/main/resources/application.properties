spring.application.name=amancay

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amancay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

supabase.url=${SUPABASE_URL}
supabase.jwt.issuer=${supabase.url}/auth/v1
supabase.jwt.jwks-uri=${supabase.jwt.issuer}/.well-known/jwks.json

amancay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
amancay.security.dev-user.enabled=${AMANCAY_SECURITY_DEV_USER_ENABLED:false}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Cotizacion de envios (OpenStreetMap: Nominatim + OSRM, sin API key).
# El origen es el deposito desde donde salen los pedidos.
amancay.shipping.origin.lat=${SHIPPING_ORIGIN_LAT:-34.6170}
amancay.shipping.origin.lon=${SHIPPING_ORIGIN_LON:-58.3817}
amancay.shipping.base-cost=${SHIPPING_BASE_COST:5.00}
amancay.shipping.cost-per-km=${SHIPPING_COST_PER_KM:0.50}
# Paises donde se busca la direccion (codigos ISO separados por coma).
amancay.shipping.country-codes=${SHIPPING_COUNTRY_CODES:ar}
amancay.shipping.nominatim-url=https://nominatim.openstreetmap.org
amancay.shipping.osrm-url=https://router.project-osrm.org
