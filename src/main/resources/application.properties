spring.application.name=amancay

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amancay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

supabase.url=${SUPABASE_URL}
supabase.jwt.issuer=${supabase.url}/auth/v1
supabase.jwt.jwks-uri=${supabase.jwt.issuer}/.well-known/jwks.json

amancay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
amancay.security.dev-user.enabled=${AMANCAY_SECURITY_DEV_USER_ENABLED:false}

# Mercado Pago (Checkout Pro). Ver MERCADOPAGO.md
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.notification-url=${MP_NOTIFICATION_URL:}
mercadopago.frontend-url=${MP_FRONTEND_URL:http://localhost:5173}
mercadopago.return-path=${MP_RETURN_PATH:/checkout/resultado}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
